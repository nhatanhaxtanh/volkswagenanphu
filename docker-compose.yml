services:
  postgres:
    image: postgres:16-alpine
    container_name: vw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vwsaigon
      POSTGRES_USER: vwsaigon
      POSTGRES_PASSWORD: vwsaigon_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vw_network

  backend:
    build: ./backend
    container_name: vw_backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vwsaigon
      SPRING_DATASOURCE_USERNAME: vwsaigon
      SPRING_DATASOURCE_PASSWORD: vwsaigon_password
      APP_JWT_SECRET: ${JWT_SECRET:-vwsaigon-change-this-secret-in-production-32chars}
      SPRING_MAIL_USERNAME: ${GMAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${GMAIL_APP_PASSWORD}
      APP_MAIL_NOTIFICATION_TO: ${NOTIFICATION_EMAIL}
      APP_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2024!}
    networks:
      - vw_network

  frontend:
    build: ./frontend
    container_name: vw_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://backend:8080
    networks:
      - vw_network

  nginx:
    image: nginx:alpine
    container_name: vw_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - vw_network

volumes:
  postgres_data:

networks:
  vw_network:
    driver: bridge
